name: Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release JAR
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${RELEASE_VERSION#v}"
          else
            VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must use semantic versioning, for example 1.2.3"
            exit 1
          fi
          ./gradlew build --no-daemon -Pmod_version="$VERSION"

      - name: Create GitHub Release and upload JAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            RELEASE_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          fi
          RELEASE_TAG="v$RELEASE_VERSION"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/libs/*.jar --clobber
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$RELEASE_TAG" build/libs/*.jar \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          else
            gh release create "$RELEASE_TAG" build/libs/*.jar \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
